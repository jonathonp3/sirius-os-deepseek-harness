name: COPR SRPM

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  copr-srpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install container basics
        run: |
          dnf install -y git rpm-build rpmdevtools copr-cli patchelf gh

      - name: Install toolchain
        run: ./scripts/toolchain.sh

      - name: Enable pnpm
        run: |
          npm install -g pnpm@11.28.5

      - name: Build unpacked tree
        run: make build

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION=$(node -p "require('./.build/deepseek-harness/apps/desktop/package.json').version")
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match v${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Build SRPM
        run: ./scripts/build-srpm.sh

      - name: Submit to COPR
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          copr-cli build jonathonp3/sirius-os dist/*.src.rpm

      - name: Upload SRPM to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # copr.yml and release.yml run in parallel; create the release as a
          # draft if release.yml has not created it yet. release.yml publishes
          # the draft when its AppImage build completes.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" \
                 --notes "" \
                 --draft
          gh release upload "${GITHUB_REF_NAME}" dist/*.src.rpm --clobber
